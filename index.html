<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Техкарты — концепты дизайна</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bar:#121212;--bar-line:#2A2A2A;--muted:#8C8C8C;--accent:#E9C46A}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#F1F0EE;font-family:'Inter',-apple-system,Arial,sans-serif;color:#111;overflow:hidden}

  /* ---------- top bar ---------- */
  .bar{
    position:fixed;inset:0 0 auto 0;height:62px;background:var(--bar);color:#fff;z-index:10;
    display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--bar-line);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .brand span{font-size:11px;color:var(--muted);white-space:nowrap}
  .brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block;flex:0 0 8px}

  .tabs{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    appearance:none;border:0;background:#1E1E1E;color:#CFCFCF;font:inherit;font-size:12.5px;
    padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;
    transition:background .15s,color .15s;
  }
  .tab:hover{background:#2A2A2A;color:#fff}
  .tab.active{background:#fff;color:#111}
  .tab small{opacity:.5;font-size:10.5px;letter-spacing:.04em}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block}

  .tools{display:flex;align-items:center;gap:6px;margin-left:auto}
  .view{display:flex;background:#1E1E1E;border-radius:8px;padding:3px}
  .view button{
    appearance:none;border:0;background:transparent;color:#B9B9B9;font:inherit;font-size:12px;
    padding:7px 11px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .view button.active{background:#3A3A3A;color:#fff}
  .view svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
  .open{
    font-size:12.5px;color:#CFCFCF;text-decoration:none;padding:9px 12px;border-radius:8px;white-space:nowrap;
  }
  .open:hover{background:#1E1E1E;color:#fff}

  /* ---------- stage ---------- */
  .stage{
    position:fixed;inset:62px 0 0 0;padding:18px;display:flex;justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #FAFAF8 0%, #EFEEEC 60%, #E8E7E4 100%);
  }
  .device{
    position:relative;width:100%;height:100%;max-width:1500px;background:#fff;border-radius:10px;
    overflow:hidden;box-shadow:0 22px 60px -18px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.06);
    transition:width .28s ease, border-radius .28s ease;
  }
  .device iframe{width:100%;height:100%;border:0;display:block;background:#fff}

  body.mobile .device{
    width:392px;height:100%;border-radius:34px;border:9px solid #171717;
    box-shadow:0 34px 70px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.5);
  }

  /* ---------- caption ---------- */
  .caption{
    position:fixed;left:18px;bottom:14px;z-index:5;display:flex;align-items:center;gap:10px;
    background:rgba(18,18,18,.86);backdrop-filter:blur(8px);color:#EDEDED;padding:9px 14px;border-radius:999px;
    font-size:12px;pointer-events:none;max-width:min(70vw,720px);
    transition:opacity .3s ease;
  }
  .caption b{color:#fff;font-weight:600}
  .caption span{color:#A9A9A9}
  .caption.hide{opacity:0}


  @media (max-width:900px){
    .brand span{display:none}
    .bar{gap:10px;padding:0 12px}
    .stage{padding:10px;inset:58px 0 0 0}
    .bar{height:58px}
    .caption{display:none}
    .open{display:none}
    body.mobile .device{width:100%;border-width:0;border-radius:12px}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><i></i><b>Техкарты</b><span>· концепты лендинга для @cakes_with_benefits</span></div>

  <div class="tabs" id="tabs"></div>

  <div class="tools">
    <div class="view">
      <button id="vDesktop" class="active" title="Десктоп">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button id="vMobile" title="Телефон">
        <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
      </button>
    </div>
    <a class="open" id="openLink" href="dark-premium.html" target="_blank" rel="noopener">Открыть ↗</a>
  </div>
</div>

<div class="stage">
  <div class="device"><iframe id="frame" src="dark-premium.html" title="Концепт"></iframe></div>
</div>

<div class="caption" id="caption">
  <b id="capTitle">01 — Тёмный редакционный</b>
  <span id="capNote">Графит и латунь, крупная антиква. Премиум и статус.</span>
</div>


<script>
  const CONCEPTS = [
    { n: "01", title: "Тёмный редакционный", file: "dark-premium.html",
      note: "Графит и латунь, крупная антиква. Премиум и статус.", label: "Премиум" },
    { n: "02", title: "Технический каталог", file: "swiss-catalog.html",
      note: "Белый фон, сетка, гротеск и моноширинные подписи. Товар как спецификация.", label: "Каталог" },
    { n: "03", title: "Крафтовая пекарня", file: "retro-bakery.html",
      note: "Крафт, штампы и билеты. Тёплый «рыночный» тон.", label: "Ретро" },
    { n: "04", title: "Пастельное ателье", file: "pastel-atelier.html",
      note: "Их палитра: пыльная роза и мята, script-акценты, фото тортов. Рекомендуем.", label: "Пастель" }
  ];

  const frame = document.getElementById("frame");
  const tabs = document.getElementById("tabs");
  const openLink = document.getElementById("openLink");
  const capTitle = document.getElementById("capTitle");
  const capNote = document.getElementById("capNote");
  const caption = document.getElementById("caption");

  let current = 0;

  CONCEPTS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === 0 ? " active" : "");
    b.innerHTML = `<small>${c.n}</small>${c.label}` + (i === 3 ? ' <span class="dot"></span>' : '');
    b.onclick = () => select(i);
    tabs.appendChild(b);
  });

  function select(i) {
    current = i;
    const c = CONCEPTS[i];
    frame.src = c.file;
    openLink.href = c.file;
    capTitle.textContent = `${c.n} — ${c.title}`;
    capNote.textContent = c.note;
    [...tabs.children].forEach((el, k) => el.classList.toggle("active", k === i));
    try { history.replaceState(null, "", "#" + i); } catch (e) {}
    document.title = `${c.n} ${c.title} — концепты техкарт`;
  }

  // deep link: #2
  const fromHash = parseInt(location.hash.replace("#", ""), 10);
  if (!isNaN(fromHash) && fromHash >= 0 && fromHash < CONCEPTS.length) select(fromHash);

  // desktop / mobile
  const vD = document.getElementById("vDesktop");
  const vM = document.getElementById("vMobile");
  function setView(mobile) {
    document.body.classList.toggle("mobile", mobile);
    vD.classList.toggle("active", !mobile);
    vM.classList.toggle("active", mobile);
    localStorage.setItem("tc-view", mobile ? "mobile" : "desktop");
  }
  vD.onclick = () => setView(false);
  vM.onclick = () => setView(true);
  setView(localStorage.getItem("tc-view") === "mobile");

  // keyboard
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") select((current + 1) % CONCEPTS.length);
    if (e.key === "ArrowLeft") select((current - 1 + CONCEPTS.length) % CONCEPTS.length);
    if (e.key.toLowerCase() === "m") setView(!document.body.classList.contains("mobile"));
    if (e.key.toLowerCase() === "f") {
      document.querySelector(".bar").style.display = document.querySelector(".bar").style.display === "none" ? "flex" : "none";
      document.querySelector(".stage").style.inset = document.querySelector(".bar").style.display === "none" ? "0" : "62px 0 0 0";
    }
  });

  // fade the caption after a while so it doesn't sit on the design
  setTimeout(() => caption.classList.add("hide"), 9000);
  document.addEventListener("mousemove", () => {
    caption.classList.remove("hide");
    clearTimeout(window.__capT);
    window.__capT = setTimeout(() => caption.classList.add("hide"), 6000);
  });
</script>
</body>
</html>
